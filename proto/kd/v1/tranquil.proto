// =============================================================================
// DRM/License Messages
// =============================================================================

// License request from device
message LicenseRequest {
    string device_id = 1;              // Certificate CN
    // SHA-256 over the serialized LicensePayload the device holds (the bytes
    // the signature covers). Empty when it has no license. The server answers
    // `unchanged` when this matches the license it last issued and that
    // license is not close to expiry.
    bytes current_license_hash = 2;
    int64 device_timestamp = 3;        // UTC timestamp
}

// License response from server
message LicenseResponse {
    bool success = 1;
    LicensePayload license = 2;        // absent when unchanged
    bytes signature = 3;               // Server RSA signature over license
    int64 server_timestamp = 4;
    string error = 5;
    bool unchanged = 6;                // the license the device holds is current; nothing to save
}

// License content (signed by server)
message LicensePayload {
    string for_device = 1;             // Must match certificate CN
    uint32 max_patterns = 2;           // Maximum stored patterns
    int64 valid_from = 3;              // Unix timestamp UTC
    int64 valid_to = 4;                // Unix timestamp UTC
    string license_id = 5;             // Unique ID for revocation
    int64 issued_at = 6;
    string store_token = 7;            // JWT token for store authentication (max 384 bytes)
}

// Purchase receipt for permanently owned patterns (signed by server)
// Stored in /sd/patterns/{uuid}.licdat
message PurchaseReceipt {
    string pattern_uuid = 1;           // Pattern this receipt authorizes
    string for_device = 2;             // Must match device certificate CN
    int64 purchased_at = 3;            // Unix timestamp UTC
    string receipt_id = 4;             // Unique receipt ID for support
    string pattern_name = 5;           // Human-readable name (for diagnostics)
}

// Request to sync all purchases for this device
message SyncPurchasesRequest {
    // Freshness: SHA-256 over the receipt_ids the device holds, sorted
    // bytewise and joined with "\n"; empty when it holds none. The server
    // replies with no receipts when this matches its entitlement set.
    bytes receipts_digest = 1;
    uint32 receipt_count = 2;
}

// Response with all purchase receipts for this device
message SyncPurchasesResponse {
    repeated PurchaseReceiptBundle receipts = 1;
}

// A purchase receipt with its signature
message PurchaseReceiptBundle {
    string pattern_uuid = 1;
    bytes payload = 2;                 // Serialized PurchaseReceipt
    bytes signature = 3;               // RSA signature over payload
}

// Request to get the current store token
message GetStoreTokenRequest {}

// Response with store token
message StoreTokenResponse {
    bool success = 1;
    string store_token = 2;            // JWT token (empty if no valid license or token)
    string error = 3;                  // Error message if not successful
}