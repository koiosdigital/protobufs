syntax = "proto3";

import "kd/v1/common.proto";

package kd.v1;

message MatrxMessage {
    // Retired fields (do not reuse):
    //  4/5/11 — AppRenderRequest/AppRenderResponse/AppDataChunk: chunked
    //           render-over-socket, replaced by HTTPS pulls from the kd-api
    //           DEVICE plane (GET /d/v1/installations/:id/render.webp).
    //  107-110 — Cert* messages: device PKI is owned by the Koios SaaS now,
    //            renewal never rides the message channel.
    reserved 4, 5, 11, 107, 108, 109, 110;

    oneof message {
        ScheduleRequest schedule_request = 1;
        Schedule schedule = 2;
        ScheduleItemSetPinState schedule_item_set_pin_state = 3;

        DeviceConfigRequest device_config_request = 6;
        DeviceConfig device_config = 7;

        CurrentlyDisplayingApp currently_displaying_app = 8; //to server - device reports what is currently displaying
        DeviceInfo device_info = 9; //to server - device info payload - returns CommandResult

        //common
        CommandResult command_result = 100; //from server - generic command response
        UploadCoreDump upload_core_dump = 101; //to server - returns CommandResult

        // Sent from server when a connection is established.
        JoinResponse join_response = 104; //from server

        // Sent to server to claim the device to a user account.
        ClaimDevice claim_device = 105; //to server

        // Sent from server to trigger factory reset
        FactoryResetRequest factory_reset_request = 106; //from server
    }
}

message DeviceInfo {
    uint32 width = 1;
    uint32 height = 2;
    bool has_light_sensor = 3;
}

//MARK: Device Config
message DeviceConfigRequest {

}

// A single quiet-hours window. Times are local wall-clock (device timezone).
// A window where end < start wraps past midnight.
message MatrxQuietWindow {
    uint32 day_mask = 1;    // bitmask, bit0 = Sunday .. bit6 = Saturday
    uint32 start_hour = 2;  // 0-23
    uint32 start_min = 3;   // 0-59
    uint32 end_hour = 4;    // 0-23
    uint32 end_min = 5;     // 0-59
    bool enabled = 6;
}

message DeviceConfig {
    bool screen_enabled = 1;
    uint32 screen_brightness = 2;
    bool auto_brightness_enabled = 3;
    uint32 screen_off_lux = 4;

    // Quiet hours: while inside an enabled window the screen is turned off and
    // the render pipeline is paused. Up to 7 windows are honored by the device.
    repeated MatrxQuietWindow quiet_windows = 5;

    // Device-reported only: true when currently inside a quiet-hours window.
    // Ignored on messages sent to the device.
    bool is_quiet_now = 6;
}

message ScheduleRequest {

}

message ScheduleItem {
    bytes uuid = 1;
    uint32 display_time = 2;
    bool pinned = 3;
    bool skipped = 4;
}

message Schedule {
    repeated ScheduleItem schedule_items = 1;
}

message ScheduleItemSetPinState {
    bytes uuid = 1;
    bool pinned = 2;
}

message CurrentlyDisplayingApp {
    bytes uuid = 1; // UUID of the installation currently being displayed
}